apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazfit-backend
  namespace: default
  labels:
    app: amazfit-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazfit-backend
  template:
    metadata:
      labels:
        app: amazfit-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/dolfino/amazfit-backend:59a2cd243b719b91c4c46b8ba89e660328e382d2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - secretRef:
            name: amazfit-secrets
            optional: true
