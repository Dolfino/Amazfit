apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazfit-frontend
  namespace: default
  labels:
    app: amazfit-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazfit-frontend
  template:
    metadata:
      labels:
        app: amazfit-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/dolfino/amazfit-frontend:59a2cd243b719b91c4c46b8ba89e660328e382d2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
