name: CI/CD Pipeline (GitOps)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yaml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Replace with actual github username
  OWNER: meu-user
  BACKEND_IMAGE_NAME: amazfit-backend
  FRONTEND_IMAGE_NAME: amazfit-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- Build & Push Backend ---
      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build & Push Frontend ---
      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Update Kubernetes manifests (GitOps) ---
      - name: Inject image tags in K8s Manifests
        run: |
          # Use sed to replace the placeholder GITHUB_SHA with the current commit SHA
          sed -i "s/\${GITHUB_SHA}/${{ github.sha }}/g" k8s/backend-deployment.yaml
          sed -i "s/\${GITHUB_SHA}/${{ github.sha }}/g" k8s/frontend-deployment.yaml

      - name: Commit and push changes to trigger ArgoCD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git commit -m "chore(gitops): update container image tags to ${{ github.sha }} [skip ci]"
          git push origin main
